include-directory = ./modules/ 

; #282a2ecc
[colors]
; background = #282a2ecc
; background-alt = #1e2024e6

; Colora
background = #232529
background-alt = #2c2f35
; foreground = #C5C8C6
; primary = #2b96b4
; secondary = #8ABEB7
; alert = #A54242
; disabled = #707880

; xrdb color
; background = ${xrdb:background}
; background-alt = ${xrdb:color4}
foreground = ${xrdb:foreground}
primary = ${xrdb:color12}
secondary = ${xrdb:color12}
alert = ${xrdb:color1}
disabled = #707880

[bar/main]
width = 100%
height = 20pt
radius = 0

dpi = 98
bottom = false

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2.93pt

border-size = 0pt
border-color = #00000000

padding-left = 0
padding-right = 2

module-margin = 1

separator = ""
separator-foreground = ${colors.disabled}

font-0 = UbuntuMono Nerd Font:size=12;2
font-1 = UbuntuMono Nerd Font:size=11;2

modules-left = xworkspaces xwindow i3
modules-center = date 
modules-right = systray battery pulseaudio cpu  

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; wm-restack = generic
; wm-restack = bspwm
wm-restack = i3

; override-redirect = true

; This module is not active by default (to enable it, add it to one of the
; modules-* list above).
; Please note that only a single tray can exist at any time. If you launch
; multiple bars with this module, only a single one will show it, the others
; will produce a warning. Which bar gets the module is timing dependent and can
; be quite random.
; For more information, see the documentation page for this module:
; https://polybar.readthedocs.io/en/stable/user/modules/tray.html

[bar/timer]
width = 100%
height = 20pt
radius = 0

; dpi = 96
bottom = true

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 0pt
border-color = #00000000

padding-left = 0
padding-right = 1

module-margin = 1

separator = ""
separator-foreground = ${colors.disabled}

font-0 = UbuntuMono Nerd Font:size=12;2

modules-left = 
modules-center = termdown 
modules-right = 

cursor-click = pointer
cursor-scroll = ns-resize

wm-restack = i3

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
