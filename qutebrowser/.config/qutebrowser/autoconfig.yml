# If a config.py file exists, this file is ignored unless it's explicitly loaded
# via config.load_autoconfig(). For more information, see:
# https://github.com/qutebrowser/qutebrowser/blob/main/doc/help/configuring.asciidoc#loading-autoconfigyml
# DO NOT edit this file by hand, qutebrowser will overwrite it.
# Instead, create a config.py - see :help for details.

config_version: 2
settings:
  aliases:
    global:
      q: close
      qa: quit
      sh: history
      w: session-save
      wq: quit --save
      wqa: quit --save
  auto_save.session:
    global: true
  backend:
    global: webengine
  bindings.commands:
    global:
      normal:
        sh: history
  colors.statusbar.passthrough.bg:
    global: '#17314B'
  colors.tabs.even.bg:
    global: red
  colors.webpage.darkmode.algorithm:
    global: lightness-cielab
  colors.webpage.darkmode.contrast:
    global: 1.0
  colors.webpage.darkmode.enabled:
    global: true
  colors.webpage.darkmode.policy.images:
    global: smart
  colors.webpage.darkmode.policy.page:
    global: always
  colors.webpage.preferred_color_scheme:
    global: dark
  completion.cmd_history_max_items:
    global: 15
  completion.scrollbar.width:
    global: 12
  completion.web_history.max_items:
    global: 70
  confirm_quit:
    global:
    - multiple-tabs
  content.autoplay:
    global: false
  content.blocking.enabled:
    global: true
  content.blocking.hosts.lists:
    global:
    - https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
    - https://jsfiddle.net
  content.blocking.whitelist:
    global:
    - https://www.fastssh.com/*
  content.headers.user_agent:
    global: Mozilla/5.0 ({os_info}) AppleWebKit/{webkit_version} (KHTML, like Gecko)
      {upstream_browser_key}/{upstream_browser_version_short} Safari/{webkit_version}
  content.images:
    global: true
  content.javascript.clipboard:
    http://localhost:8000: access-paste
    https://antigravity.google: access-paste
    https://app.emergent.sh: access-paste
    https://chat.deepseek.com: access-paste
    https://chatgpt.com: access-paste
    https://dash.cloudflare.com: access-paste
    https://dash.infinityfree.com: access-paste
    https://docs.astro.build: access-paste
    https://docs.google.com: access-paste
    https://drive.google.com: access-paste
    https://duckduckgo.com: access-paste
    https://emojidb.org: access-paste
    https://feathericons.dev: access-paste
    https://flowbite.com: access-paste
    https://gdquest.github.io: access-paste
    https://gemini.google.com: access-paste
    https://giphy.com: access-paste
    https://github.com: access-paste
    https://gohugo.io: access-paste
    https://heroicons.com: access-paste
    https://kiro.dev: access-paste
    https://lahelu.com: access-paste
    https://lucide.dev: access-paste
    https://mail.proton.me: access-paste
    https://mail.tm: access-paste
    https://supabase.com: access-paste
    https://victor-deepseek-v4-flash-0731-free-endpoint.static.hf.space: access-paste
    https://www.bing.com: access-paste
    https://www.canva.com: access-paste
    https://www.figma.com: access-paste
    https://www.tailwindcss-animated.com: access-paste
  content.local_content_can_access_remote_urls:
    global: true
  content.media.audio_capture:
    global: true
    https://meet.google.com: true
  content.media.audio_video_capture:
    global: true
    https://meet.google.com: true
  content.media.video_capture:
    https://meet.google.com: true
    https://www.dicoding.com: true
  content.mouse_lock:
    https://krunker.io: true
    https://www.figma.com: true
  content.notifications.enabled:
    https://distrosea.com: true
    https://mail.proton.me: false
    https://mail.zoho.com: true
    https://mailadmin.zoho.com: true
    https://www.chess.com: true
    https://www.facebook.com: true
  content.pdfjs:
    global: false
  content.prefers_reduced_motion:
    global: true
  content.print_element_backgrounds:
    global: false
  content.proxy:
    global: system
  content.register_protocol_handler:
    https://mail.google.com?extsrc=mailto&url=%25s: false
    https://mail.proton.me#mailto=%25s: false
  content.user_stylesheets:
    global: ~/.config/qutebrowser/usercss/roadmap.css
  downloads.prevent_mixed_content:
    global: false
  editor.command:
    global:
    - st
    - -e
    - nvim
    - -f
    - '{file}'
    - -c
    - '{line}G{column0}l'
  fonts.default_family:
    global: UbuntuMono Nerd Font Mono
  fonts.default_size:
    global: 11.6pt
  hints.border:
    global: '1px solid #E3BE23'
  hints.chars:
    global: asdfghjkl
  qt.force_platformtheme:
    global: qt5
  qt.force_software_rendering:
    global: none
  qt.workarounds.disable_accelerated_2d_canvas:
    global: never
  scrolling.bar:
    global: overlay
  scrolling.smooth:
    global: false
  session.lazy_restore:
    global: false
  statusbar.show:
    global: always
  tabs.show:
    global: multiple
  url.searchengines:
    global:
      D: https://duckduckgo.com/?q={}
      DEFAULT: https://www.google.com/search?q={}
  window.hide_decoration:
    global: true
