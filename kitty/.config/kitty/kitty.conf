# --- Fonts ---
font_family                 UbuntuMono Nerd Font
bold_font                   auto
italic_font                 UbuntuMono Nerd Font Italic
bold_italic_font            auto
font_size                   12.0
modify_font                 strikethrough_position 2px
modify_font                 cell_height -1px
text_composition_strategy   1 10

# --- Cursor and Mouse ---
cursor_blink_interval       .5
# cursor_trail                3
# cursor_trail_decay          0.1 0.4
# cursor_trail_start_threshold 2
mouse_map left press        ungrabbed mouse_selection normal
mouse_map ctrl+shift+left press ungrabbed mouse_drag_window

# --- Window Layout ---
window_border_width         1.5pt
active_border_color         #3a81ee
inactive_border_color       #666666
confirm_os_window_close     2
background                  #111929
foreground                  #e6eaf2
background_opacity          0.95
dynamic_background_opacity  yes

# --- Tabs ---
tab_separator               ""
tab_title_template          "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{tab.last_focused_progress_percent} {index} {fmt.bg._1a2334} {'󰊓 ' if layout_name == 'stack' else ''}{title[:15]}{'…' if len(title) > 15 else ''} "

# --- Colors ---
color0                      #222D31
color8                      #585858
color1                      #c12c2c
color9                      #bf4040
color2                      #59a559
color10                     #6cb06c
color3                      #db912a
color11                     #cd8f38
color4                      #3876b5
color12                     #518dca
color5                      #b23bae
color13                     #ba5fb7
color6                      #1ABB9B
color14                     #1ABB9B
color7                      #d8d8d8
color15                     #f8f8f8
color16 #ff8700

# --- System ---
allow_remote_control        socket-only
listen_on                   unix:/tmp/mykitty-{kitty_pid}
remote_control_password     "YOU SHALL NOT PASS" focus-window resize-window
shell_integration           no-title

# --- Key Bindings ---
kitty_mod                   ctrl+shift

map alt+k                   scroll_line_up
map alt+j                   scroll_line_down
map alt+shift+k             scroll_page_up
map alt+shift+j             scroll_page_down
map ctrl+alt+enter          launch --cwd=current
map alt+q                   close_window

# Font size controls
map kitty_mod+equal         change_font_size all +2.0
map kitty_mod+plus          change_font_size all +2.0
map kitty_mod+k             change_font_size all +2.0
map kitty_mod+kp_add        change_font_size all +2.0
map cmd+plus                change_font_size all +2.0
map cmd+equal               change_font_size all +2.0
map shift+cmd+equal         change_font_size all +2.0

map kitty_mod+minus         change_font_size all -2.0
map kitty_mod+kp_subtract   change_font_size all -2.0
map kitty_mod+j             change_font_size all -2.0
map cmd+minus               change_font_size all -2.0
map shift+cmd+minus         change_font_size all -2.0
map kitty_mod+backspace     change_font_size all 0

# Remote control spacing
map alt+shift+p             remote_control set-spacing padding-h=155
map alt+shift+o             remote_control set-spacing padding-h=0
map alt+space>0             goto_tab 10

# --- Includes ---
include ./tmux.kitty.conf
