# --- Layouts ---
# Use the 'splits' layout to split screens like tmux
enabled_layouts splits,stack

# --- Tab Settings (Windows in Tmux) ---
tab_bar_edge            bottom
tab_bar_style           separator
tab_bar_background      #0e1522
active_tab_foreground   #ffffff
active_tab_background   #41669f
active_tab_font_style   bold
inactive_tab_foreground #afafaf
inactive_tab_background #2e4870
#1a2334

# Start indexing at 1 (like base-index 1)
# tab_bar_min_tabs 1

# --- Mappings: Prefix Simulation (Alt + Space) ---
# Mimic 'bind-key' which requires a prefix in tmux

# Map toggle layout
map alt+space>z toggle_layout stack
map alt+f       toggle_layout stack

# Split Panes (Horizontal & Vertical)
# Tmux: bind \ split-window -h and bind " split-window -v
map alt+space>\ launch --location=vsplit --cwd=current
map alt+space>| launch --location=vsplit --cwd=current
map alt+space>" launch --location=hsplit --cwd=current
map alt+space>% launch --location=vsplit --cwd=current
map alt+space>t launch --location=hsplit --cwd=current --bias=27
map alt+space>, set_tab_title

# Pane Navigation (Vim Style)
# Tmux: bind h/j/k/l select-pane
map alt+space>h neighboring_window left
map alt+space>j neighboring_window down
map alt+space>k neighboring_window up
map alt+space>l neighboring_window right
map alt+space>1 goto_tab 1
map alt+space>2 goto_tab 2
map alt+space>3 goto_tab 3
map alt+space>4 goto_tab 4
map alt+space>5 goto_tab 5
map alt+space>6 goto_tab 6
map alt+space>7 goto_tab 7
map alt+space>8 goto_tab 8
map alt+space>9 goto_tab 9
map alt+space>0 goto_tab 10

map ctrl+j neighboring_window down
map ctrl+k neighboring_window up
map ctrl+h neighboring_window left
map ctrl+l neighboring_window right

# Unset the mapping to pass the keys to neovim
map --when-focus-on var:IS_NVIM ctrl+j
map --when-focus-on var:IS_NVIM ctrl+k
map --when-focus-on var:IS_NVIM ctrl+h
map --when-focus-on var:IS_NVIM ctrl+l

allow_remote_control yes
listen_on unix:@mykitty

# Create New Tab
# Tmux: bind c and bind v
map alt+space>v new_tab
map alt+space>c new_tab_with_cwd

# --- Mappings: Direct (Without Prefix) ---
# Mimic 'bind -n' in tmux

# Switch Tabs (Windows in Tmux)
# Tmux: bind -n s-left/right and M-h/l
map shift+left  previous_tab
map shift+right next_tab
map alt+h       previous_tab
map alt+l       next_tab

# Move Tabs
# Tmux: bind -n s-c-left/right and M-S-h/l
map ctrl+shift+left move_tab_backward
map ctrl+shift+right move_tab_forward
map alt+shift+h      move_tab_backward
map alt+shift+l      move_tab_forward

# Resize Panes (Alt + Shift + Arrows)
# Tmux: bind -n M-S-Left/Right/Up/Down
map alt+shift+left  resize_window narrower 2
map alt+shift+right resize_window wider 2
map alt+shift+up    resize_window taller 2
map alt+shift+down  resize_window shorter 2

# Cycle & Swap Panes
# Tmux: M-[ / M-] and M-{ / M-}
map alt+[ previous_window
map alt+] next_window
map alt+shift+[ move_window_backward
map alt+shift+] move_window_forward
# Using U/I
map alt+i previous_window
map alt+u next_window
map alt+shift+i move_window_backward
map alt+shift+u move_window_forward

# --- General Settings ---
mouse_hide_wait 3.0
detect_urls yes
repaint_delay 10
input_delay 3
sync_to_monitor yes

# Copy Mode (Vi Style)
# Kitty uses a scrollback buffer. 
# Press Ctrl+Shift+H to view scrollback (like copy-mode)
map ctrl+shift+h show_scrollback

