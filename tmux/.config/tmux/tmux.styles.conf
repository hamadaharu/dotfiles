set -g status-position bottom

# Use default terminal colorscheme (from Xresources)
set -g status-style bg='#0e1522'
set -g status-fg default
set -g window-status-style bg=default,fg=default
set -g window-status-current-style bg=default,fg=default

setw -g window-status-current-format "#[bg=colour12] #I #[bg=colour0] #W "
setw -g window-status-format "#[bg=#2e4870] #I #[bg=colour0] #W "
setw -g window-status-separator ""

# Status Right
set -g status-right '\
#{?client_prefix,#[bg=colour9],#[bg=colour12]}\
#[fg=colour15] #{?window_zoomed_flag,󰊓,󰘧} #[bg=colour0] #S '

# Other Status
# #[bg=default,fg=colour15]   #[bg=colour0] %H:%M:%S \

# Status Left
set -g status-left ''

# Pane Style
setw -g pane-active-border-style "#{?pane_in_mode,fg=yellow,#{?synchronize-panes,fg=red,fg=colour12}}"

# Use Default Cursor
set -g prompt-cursor-colour default
