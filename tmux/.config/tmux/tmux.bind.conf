# Change bind 
unbind C-b
set -g prefix M-space
bind M-space send-prefix

# split panes 
bind \\ split-window -h
unbind %

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

# pane swap (stay in prefix)

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-S-Left resize-pane -L 2
bind -n M-S-right resize-pane -R 2
bind -n M-S-up resize-pane -U 2
bind -n M-S-down resize-pane -D 2

# shift arrow to switch windows and move windows
bind -n s-left  previous-window
bind -n s-right next-window
bind -n s-c-left "swap-window -t -1; previous-window"
bind -n s-c-right "swap-window -t +1; next-window"

# shift alt vim keys to switch windows
bind -n M-h previous-window
bind -n M-l next-window
bind -n M-S-h "swap-window -t -1; previous-window"
bind -n M-S-l "swap-window -t +1; next-window"

# alt vim cycle select pane and swap pane
bind -n M-[ selectp -t :.-
bind -n M-] selectp -t :.+
bind -n M-\{ swapp -U
bind -n M-\} swapp -D
