# set 256 color
set -g default-terminal "st-256color"
set-option -sa terminal-overrides ",xterm*:Tc"
# set -as terminal-overrides ',st*:Cr=\E]12;red\a'

# split panes using | and -
# bind | split-window -h
# bind - split-window -v
# unbind '"'
# unbind %

set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# import binding
source-file $HOME/.config/tmux/tmux.bind.conf

# import styles
source-file $HOME/.config/tmux/tmux.styles.conf

set -g @yank_selection_mouse 'clipboard'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'

run '~/.tmux/plugins/tpm/tpm'

# set vi-mode
set-window-option -g mode-keys vi

# sixel 
set -g allow-passthrough on     # Izinkan escape sequences melewati tmux (untuk Sixel)
set -g extended-keys always     # Untuk terminal modern

# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
# bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
# bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind c new-window -c "#{pane_current_path}"
bind v new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
